name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/bin

          mapfile -t binaries < <(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[].targets[] |
                select(.kind | index("bin")) | .name' |
              sort -u
          )

          if [ "${#binaries[@]}" -eq 0 ]; then
            echo "No binary targets found"
            exit 1
          fi

          for binary in "${binaries[@]}"; do
            cp "target/release/${binary}" dist/bin/
          done

          archive="${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"

          tar -czf "dist/${archive}" -C dist/bin .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
